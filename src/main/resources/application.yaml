server:
  port: 8082
  servlet:
    context-path:

integration:
  sync:
    url: ${SYNC_SERVICE_URL:http://localhost:3000/api/sincronizza}
    # Facoltativo: se valorizzato viene inviato come Bearer al microservizio ERP (che deve avere lo stesso SYNC_API_TOKEN).
    token: ${SYNC_API_TOKEN:}

spring:
  application:
    name: gestionale-magazzino

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  # --- DATASOURCE MySQL ---
  datasource:
    # I valori predefiniti sono solo per lo sviluppo locale: in altri ambienti impostare DB_URL, DB_USERNAME, DB_PASSWORD.
    url: ${DB_URL:jdbc:mysql://localhost:3306/service?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # --- FLYWAY ---
  # Su un DB esistente (senza storico Flyway) fa il baseline alla V1 senza modificare nulla.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 1

  # --- JPA / HIBERNATE ---
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  # --- JACKSON ---
  jackson:
    deserialization:
      accept-float-as-int: false
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# --- SICUREZZA ---
# Il segreto JWT non ha un valore predefinito: senza JWT_SECRET (almeno 32 caratteri casuali) l'applicazione non parte.
# Il primo amministratore si crea all'avvio se la tabella utenti è vuota (ADMIN_USERNAME / ADMIN_PASSWORD).
security:
  jwt:
    secret: ${JWT_SECRET:}
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  bootstrap:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:}

# --- SWAGGER / OPENAPI ---
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false
  default-produces-media-type: application/json

# --- LOGGING ---
logging:
  level:
    root: INFO
    pilot.servizi: INFO